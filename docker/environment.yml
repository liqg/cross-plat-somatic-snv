name: cross-plat-somatic-snv
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=1.26
  - pandas=1.5
  - scipy=1.11
  - matplotlib=3.7
  - scikit-learn=1.3
  - xgboost=1.7
  - statsmodels=0.14
  - openpyxl=3.1
  - pyyaml=6.0
  - pysam=0.22

  # sequencing tools
  - fastp=0.23.4
  - bwa=0.7.17
  - samtools=1.17
  - bcftools=1.17
  - htslib=1.17
  - bedtools=2.31.1
  - parallel
  - gatk4=4.2.6.1
  - bam-readcount=1.0.1
  - openjdk=8

  # workflow
  - snakemake-minimal=7.32.4

  # R / SomaticXGB
  - r-base=4.2.3
  - r-data.table
  - r-xgboost=1.7.6
  - r-caret
  - r-r.utils
  - r-proc
  - r-gridextra
  - r-ggplot2
  - r-cowplot
  - r-png
  - r-prroc
  - r-jsonlite
  - r-magrittr
  - r-stringr
  - r-tidyr
  - r-tibble
  - r-rcpp
